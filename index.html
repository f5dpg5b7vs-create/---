<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050608">

<title>탐라배 곱꽹대전</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050608;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  background: none;
  color: inherit;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: block;
}


/* =========================================
   PASSWORD
========================================= */

#passwordScreen {
  background: #050608;
}

.password-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: .42;
  filter: brightness(.55) saturate(.7);
}

.password-dark {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(3,5,8,.58),
      rgba(3,5,8,.78)
    );
}

.password-content {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  padding: 30px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .32em;
  opacity: .65;
  margin-bottom: 18px;
}

.password-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(29px, 8vw, 44px);
  font-weight: 400;
  letter-spacing: -.04em;
  margin-bottom: 42px;
}

.password-line {
  width: min(260px, 72vw);
  margin: 0 auto;
  border-bottom: 1px solid rgba(255,255,255,.45);
  display: flex;
  align-items: center;
}

.password-input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  text-align: center;
  padding: 13px 5px;
  font-size: 14px;
  letter-spacing: .18em;
}

.password-input::placeholder {
  color: rgba(255,255,255,.35);
}

.enter-button {
  margin-top: 25px;
  font-size: 9px;
  letter-spacing: .35em;
  opacity: .62;
  padding: 10px;
}

.password-error {
  height: 18px;
  margin-top: 13px;
  font-size: 10px;
  color: rgba(255,255,255,.55);
}


/* =========================================
   MAIN PHOTO
========================================= */

#mainScreen {
  background: #050608;
}

.main-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transition:
    transform .38s ease,
    filter .38s ease;
}

.main-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.12),
      rgba(0,0,0,.04) 50%,
      rgba(0,0,0,.24)
    );
}


/* =========================================
   INVISIBLE HOTSPOTS
========================================= */

.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 5;
  background: transparent;
  border: 0;
  outline: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}


/* 달 → 크레딧 */
.moon {
  left: 50%;
  top: 16%;
  width: 25%;
  height: 12%;
  border-radius: 50%;
}


/* 책 → 글 */
.book {
  left: 23%;
  top: 73%;
  width: 30%;
  height: 8%;
}


/* 우체통 → 그림 */
.mailbox {
  left: 74%;
  top: 62%;
  width: 20%;
  height: 12%;
}


/* 창문 1 → 아무것도 없음 */
.window1 {
  left: 6%;
  top: 30%;
  width: 10%;
  height: 15%;
}


/* 창문 2 → 영상 */
.window2 {
  left: 21%;
  top: 38%;
  width: 12%;
  height: 10%;
}


/* 고양이 발자국 → 후기 */
.footprints {
  left: 18%;
  top: 63%;
  width: 8%;
  height: 4%;
}


/* =========================================
   TOUCH EFFECT
========================================= */

.ripple {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 100;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,.5);
  box-shadow: 0 0 18px rgba(255,255,255,.22);
  animation: quietRipple .34s ease-out forwards;
}

@keyframes quietRipple {
  0% {
    width: 5px;
    height: 5px;
    opacity: .5;
  }

  100% {
    width: 75px;
    height: 75px;
    opacity: 0;
  }
}

.leaving .main-photo {
  transform: scale(1.025);
  filter: brightness(.75) blur(1px);
}


/* =========================================
   CATEGORY
========================================= */

.category-screen {
  background:
    radial-gradient(
      circle at 50% 0%,
      #20242b 0%,
      #0c0e12 42%,
      #050608 100%
    );
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.category-inner {
  width: min(680px, 100%);
  min-height: 100%;
  padding: 70px 25px 80px;
  margin: auto;
}

.back {
  font-size: 10px;
  letter-spacing: .25em;
  opacity: .48;
  padding: 10px 0;
}

.category-heading {
  margin-top: 48px;
  margin-bottom: 45px;
}

.category-small {
  font-size: 9px;
  letter-spacing: .3em;
  opacity: .4;
  margin-bottom: 14px;
}

.category-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 42px;
  font-weight: 400;
  letter-spacing: -.05em;
}

.category-description {
  margin-top: 12px;
  font-size: 11px;
  opacity: .42;
}

.post-list {
  border-top: 1px solid rgba(255,255,255,.12);
}

.post-item {
  width: 100%;
  display: grid;
  grid-template-columns: 38px 1fr auto;
  gap: 12px;
  text-align: left;
  padding: 23px 2px;
  border-bottom: 1px solid rgba(255,255,255,.09);
  -webkit-tap-highlight-color: transparent;
}

.post-number {
  font-family: Georgia, serif;
  font-size: 12px;
  opacity: .35;
}

.post-author {
  font-size: 14px;
  line-height: 1.5;
}

.post-partner {
  font-size: 10px;
  opacity: .42;
  margin-top: 4px;
}

.post-arrow {
  font-size: 13px;
  opacity: .3;
}


/* =========================================
   READING PAGE
========================================= */

.read-screen {
  background: #f8f7f3;
  color: #151515;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.read-inner {
  width: min(720px, 100%);
  margin: auto;
  padding: 38px 27px 90px;
}

.read-back {
  color: #111;
  opacity: .45;
  font-size: 10px;
  letter-spacing: .18em;
  padding: 10px 0;
}

.read-number {
  margin-top: 65px;
  font-family: Georgia, serif;
  font-size: 12px;
  opacity: .38;
}

.read-title {
  margin-top: 20px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(28px, 8vw, 42px);
  font-weight: 400;
  line-height: 1.18;
  letter-spacing: -.04em;
}

.read-author {
  margin-top: 17px;
  font-size: 11px;
  opacity: .5;
}

.read-divider {
  width: 35px;
  height: 1px;
  background: #222;
  opacity: .25;
  margin: 55px 0 42px;
}

.read-body {
  font-family: Georgia, "Batang", "Noto Serif KR", serif;
  font-size: 16px;
  line-height: 2.05;
  word-break: keep-all;
}

.read-body p {
  margin-bottom: 25px;
}

.read-empty {
  font-family: Georgia, serif;
  font-size: 15px;
  line-height: 2;
  opacity: .55;
}


/* =========================================
   CREDIT / REVIEW
========================================= */

.info-screen {
  background:
    radial-gradient(
      circle at 50% 0%,
      #24272c 0,
      #0b0d10 45%,
      #050608 100%
    );
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.info-inner {
  width: min(680px, 100%);
  margin: auto;
  padding: 55px 27px 90px;
}

.info-title {
  margin-top: 55px;
  font-family: Georgia, serif;
  font-size: 40px;
  font-weight: 400;
  letter-spacing: -.04em;
}

.info-subtitle {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: .15em;
  opacity: .4;
}

.info-section {
  margin-top: 55px;
}

.info-section-title {
  font-size: 10px;
  letter-spacing: .25em;
  opacity: .45;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

.info-person {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 16px 2px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  font-size: 12px;
  line-height: 1.5;
}

.info-person span:last-child {
  opacity: .4;
  text-align: right;
}


/* =========================================
   REVIEW
========================================= */

.review-card {
  margin-top: 24px;
  padding: 25px 0;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.review-label {
  font-size: 9px;
  letter-spacing: .2em;
  opacity: .35;
  margin-bottom: 14px;
}

.review-text {
  font-family: Georgia, serif;
  font-size: 16px;
  line-height: 1.8;
  opacity: .85;
}

.review-author {
  margin-top: 13px;
  font-size: 10px;
  opacity: .35;
}


/* =========================================
   VIDEO
========================================= */

.video-placeholder {
  margin-top: 50px;
  padding: 60px 20px;
  border-top: 1px solid rgba(255,255,255,.1);
  border-bottom: 1px solid rgba(255,255,255,.1);
  text-align: center;
}

.video-placeholder-title {
  font-family: Georgia, serif;
  font-size: 23px;
}

.video-placeholder-text {
  margin-top: 12px;
  font-size: 10px;
  opacity: .4;
  letter-spacing: .08em;
}


/* =========================================
   DESKTOP
========================================= */

@media (min-width: 700px) {
  .main-photo,
  .password-photo {
    object-position: center;
  }

  .category-inner,
  .info-inner,
  .read-inner {
    padding-left: 40px;
    padding-right: 40px;
  }
}
</style>
</head>


<body>


<!-- ======================================
     PASSWORD SCREEN
====================================== -->

<section id="passwordScreen" class="screen active">

  <img
    src="winter.jpg"
    class="password-photo"
    alt=""
  >

  <div class="password-dark"></div>

  <div class="password-content">

    <div class="eyebrow">
      LITERARY WEBZINE
    </div>

    <h1 class="password-title">
      탐라배 곱꽹대전
    </h1>

    <div class="password-line">
      <input
        id="passwordInput"
        class="password-input"
        type="password"
        placeholder="PASSWORD"
        autocomplete="off"
      >
    </div>

    <button
      id="enterButton"
      class="enter-button"
    >
      ENTER
    </button>

    <div
      id="passwordError"
      class="password-error"
    ></div>

  </div>

</section>



<!-- ======================================
     MAIN SCREEN
====================================== -->

<section id="mainScreen" class="screen">

  <img
    src="winter.jpg"

    alt="눈 내리는 겨울밤 골목"
  >

  <div class="main-shade"></div>


  <!-- 달 → 크레딧 -->
  <button
    class="hotspot moon"
    aria-label="크레딧"
    data-target="creditsScreen">
  </button>


  <!-- 책 → 글 -->
  <button
    class="hotspot book"
    aria-label="글"
    data-target="writingScreen">
  </button>


  <!-- 우체통 → 그림 -->
  <button
    class="hotspot mailbox"
    aria-label="그림"
    data-target="drawingScreen">
  </button>


  <!-- 창문 1 → 아무것도 없음 -->
  <button
    class="hotspot window1"
    aria-label="창문">
  </button>


  <!-- 창문 2 → 영상 -->
  <button
    class="hotspot window2"
    aria-label="영상"
    data-target="videoScreen">

  <!-- 고양이 발자국 → 참여자 후기 -->
  <button
    class="hotspot footprints"
    aria-label="참여자 후기"
    data-target="reviewScreen">
  </button>

</section>
